name: Sync From Gitee

on:
  schedule:
    # 每 6 小时自动检查一次更新（可自行修改时间）
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync from Gitee
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          git remote add upstream https://gitee.com/hidyouth/smart-metric.git
          git fetch upstream
          
          git checkout master
          git merge upstream/master --allow-unrelated-histories -m "chore: sync from gitee"

          git push origin master
